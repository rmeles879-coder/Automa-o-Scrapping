[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-production"
version = "0.1.0"
description = "Base modular para automação de produção de vídeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_production = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
